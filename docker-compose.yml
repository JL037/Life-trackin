version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lifetrack-db
    environment:
      POSTGRES_USER: lifetrack
      POSTGRES_PASSWORD: lifetrack_dev
      POSTGRES_DB: lifetrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifetrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: lifetrack-backend
    environment:
      - DATABASE_URL=postgres://lifetrack:lifetrack_dev@db:5432/lifetrack?sslmode=disable
      - PORT=8080
      - APP_ENV=development
      - APP_URL=http://127.0.0.1:8080
      - FRONTEND_URL=http://127.0.0.1:5173
      - JWT_SECRET=dev-secret-change-in-production
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
